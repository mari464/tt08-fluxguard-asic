<text x="608" y="309" font-size="11.5" font-weight="bold" fill="#633806" text-anchor="start">PEAK_N</text>
<text x="672" y="166" font-size="11" font-weight="normal" fill="#0F6E56" text-anchor="end">◄ ESP32</text>
<text x="672" y="204" font-size="11" font-weight="normal" fill="#0F6E56" text-anchor="end">◄ ESP32</text>
<text x="672" y="242" font-size="11" font-weight="normal" fill="#0F6E56" text-anchor="end">◄ ESP32</text>
