<text x="982" y="318" font-size="11" font-weight="normal" fill="#555" text-anchor="start">→ LED + 330 Ω</text>
<text x="982" y="394" font-size="11" font-weight="normal" fill="#555" text-anchor="start">→ LED + 330 Ω</text>
<text x="982" y="204" font-size="11" font-weight="normal" fill="#555" text-anchor="start">→ LED (opcional)</text>
<text x="982" y="242" font-size="11" font-weight="normal" fill="#555" text-anchor="start">→ LED (opcional)</text>
<text x="982" y="356" font-size="11" font-weight="normal" fill="#999" text-anchor="start">sin conectar</text>
<rect x="690" y="470" width="370" height="150" rx="8" fill="#FCECEC" stroke="#C54343" stroke-width="1.2"/>
<text x="702" y="492" font-size="14" font-weight="bold" fill="#791F1F" text-anchor="start">7 · Salida de disparo (TRIP)</text>
<text x="702" y="514" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">uo[7] TRIP → R9 1 kΩ → Q1 MMBT2222 (base)</text>
<text x="702" y="533" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Q1 → relé 5 V o SSR/optoacoplador</text>
<text x="702" y="552" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">D2 1N4148 en antiparalelo con la bobina</text>
<text x="702" y="571" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Relé → bobina de disparo del interruptor</text>
<text x="702" y="590" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Instalación dentro del tablero: electricista</text>
<path d="M976 428 L985 428 L985 455 L875 455 L875 468" fill="none" stroke="#C54343" stroke-width="2" marker-end="url(#a)"/>
<text x="990" y="432" font-size="11.5" font-weight="bold" fill="#791F1F" text-anchor="start">TRIP</text>
<rect x="20" y="470" width="620" height="150" rx="8" fill="#F4F3EF" stroke="#8A8880" stroke-width="1.2"/>
<text x="32" y="492" font-size="14" font-weight="bold" fill="#444441" text-anchor="start">8 · Alimentación</text>
<text x="32" y="514" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">5 V: fuente aislada HLK-PM01 (desde el tablero) o USB-C</text>
<text x="32" y="533" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">U2 AMS1117-3.3 → 3V3 para ESP32, U1, sensores y E/S del ASIC</text>
<text x="32" y="552" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">ASIC: 1.8 V de núcleo y selección de proyecto los da la placa demo de TT</text>
<text x="32" y="571" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">v1 recomendada: esta tarjeta como placa hija de la demo board de Tiny Tapeout</text>
<text x="32" y="590" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Desacoplo: 100 nF por cada CI + 10 µF por riel</text>
<rect x="20" y="650" width="1400" height="190" rx="10" fill="#F7FBF9" stroke="#1D9E75" stroke-dasharray="6 4" stroke-width="1.2"/>
<text x="36" y="674" font-size="14" font-weight="bold" fill="#085041" text-anchor="start">9 · Camino a la nube (broadcast por publicación/suscripción)</text>
<rect x="40" y="694" width="250" height="62" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="165" y="720" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Nodo FluxGuard</text>
<text x="165" y="740" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle">ESP32 del bloque 6</text>
<path d="M292 725 L388 725" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="390" y="694" width="250" height="62" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="515" y="720" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Gateway ESP32</text>
<text x="515" y="740" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle">ESP-NOW → Wi-Fi/LTE</text>
<path d="M642 725 L738 725" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="740" y="694" width="250" height="62" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="865" y="720" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Broker MQTT</text>
<text x="865" y="740" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle">fluxguard/&lt;sitio&gt;/&lt;nodo&gt;/…</text>
<path d="M992 725 L1088 725" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1090" y="694" width="250" height="62" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1215" y="720" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Suscriptores</text>
<text x="1215" y="740" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle">Dashboard · alertas · BD</text>
<text x="40" y="782" font-size="12" font-weight="normal" fill="#333" text-anchor="start">Telemetría: …/medicion  (QoS 0, cada 1-5 s)  ·  Alarmas: …/alerta  (QoS 1, al llegar una trama con FLAGS ≠ 0)  ·  Estado: …/estado  (Last Will = "offline")</text>
<text x="40" y="802" font-size="12" font-weight="normal" fill="#333" text-anchor="start">Trama UART ASIC→ESP32 (115200 8N1): A5 · CORRIENTE · TEMPERATURA · FLAGS · CHECKSUM     FLAGS = {0,0,0, TRIP, OVER_PK, LATCHED, OVER_T, OVER_I}</text>
<text x="40" y="822" font-size="12" font-weight="normal" fill="#333" text-anchor="start">El ESP32 agrega GPS, marca de tiempo e ID del nodo y publica en JSON. El disparo TRIP ocurre en ~1.4 µs en el ASIC, sin esperar a la nube.</text></svg>