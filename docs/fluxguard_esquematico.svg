<text x="700" y="401" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="start">CLK</text>
<line x1="676" y1="390" x2="690" y2="390" stroke="#6A5FCF" stroke-width="1.4"/>
<text x="700" y="424" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start">rst_n</text>
<text x="700" y="439" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="start">RST_N</text>
<line x1="676" y1="428" x2="690" y2="428" stroke="#6A5FCF" stroke-width="1.4"/>
