<text x="672" y="394" font-size="11" font-weight="normal" fill="#0F6E56" text-anchor="end">◄ X1 10 MHz</text>
<text x="672" y="432" font-size="11" font-weight="normal" fill="#0F6E56" text-anchor="end">◄ ESP32</text>
<rect x="1130" y="76" width="290" height="366" rx="8" fill="#E6F5EF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1142" y="98" font-size="14" font-weight="bold" fill="#085041" text-anchor="start">6 · ESP32-WROOM (nodo)</text>
<text x="1142" y="120" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Salidas hacia el ASIC:</text>
<text x="1156" y="139" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">DATA0-7 → GPIO 13,14,27,26,25,33,32,4</text>
<text x="1156" y="158" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">ADDR0/1 → GPIO 16,17   WR → GPIO 18</text>
<text x="1156" y="177" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">CLR → GPIO 19   PK_MODE → GPIO 23</text>
<text x="1156" y="196" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">RST_N → GPIO 5</text>
<text x="1142" y="215" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Entradas desde el ASIC:</text>
<text x="1156" y="234" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">UART_TX → GPIO 35 (RX de UART1)</text>
<text x="1156" y="253" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">ALERT → GPIO 36 (interrupción)</text>
<text x="1142" y="272" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Sensores:</text>
<text x="1156" y="291" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">VS → GPIO 34 (ADC)</text>
<text x="1156" y="310" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">TMP117 temp. → I2C GPIO 21/22</text>
<text x="1156" y="329" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Micro-GPS NMEA → GPIO 39 (RX UART2)</text>
<text x="1142" y="348" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Radio: ESP-NOW / Wi-Fi (antena PCB)</text>
<text x="1142" y="367" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Reloj CLK: oscilador X1 10 MHz</text>
<text x="1156" y="386" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">(alternativa: LEDC en GPIO 15)</text>
<path d="M976 162 L1128 162" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<text x="982" y="157" font-size="11.5" font-weight="bold" fill="#085041" text-anchor="start">ALERT</text>
