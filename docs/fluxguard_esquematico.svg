<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" font-family="Arial, Helvetica, sans-serif"><title>FluxGuard v1: esquemático integrado</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker></defs><rect width="1440" height="860" fill="#ffffff"/>
<text x="20" y="34" font-size="18" font-weight="bold" fill="#111" text-anchor="start">FluxGuard v1 — esquemático integrado: SCT-013 + ASIC Tiny Tapeout + ESP32 + nube</text>
<text x="20" y="56" font-size="12.5" font-weight="normal" fill="#555" text-anchor="start">Todos los niveles lógicos a 3.3 V. Las etiquetas en MAYÚSCULAS son redes: el mismo nombre en dos bloques = mismo cable.</text>
<rect x="20" y="76" width="290" height="150" rx="8" fill="#FDF3E3" stroke="#C98A1B" stroke-width="1.2"/>
<text x="32" y="98" font-size="14" font-weight="bold" fill="#633806" text-anchor="start">1 · Sensor SCT-013-030</text>
<text x="32" y="120" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Núcleo partido: abraza SOLO la fase L1</text>
<text x="32" y="139" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Salida 1 V RMS a 30 A (carga interna)</text>
<text x="32" y="158" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Jack 3.5 mm: punta → VCT</text>
<text x="102" y="177" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">manga → VMID</text>
<text x="32" y="196" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Uno por fase en tableros trifásicos</text>
<line x1="282" y1="92" x2="282" y2="214" stroke="#8B4513" stroke-width="5"/>
<ellipse cx="282" cy="150" rx="17" ry="8" fill="none" stroke="#C98A1B" stroke-width="3"/>
<rect x="20" y="246" width="290" height="196" rx="8" fill="#FDF3E3" stroke="#C98A1B" stroke-width="1.2"/>
<text x="32" y="268" font-size="14" font-weight="bold" fill="#633806" text-anchor="start">2 · Polarización y protección</text>
<text x="32" y="290" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">R1, R2 = 10 kΩ: 3V3 → VMID → GND</text>
<text x="32" y="309" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">C1 = 10 µF en VMID  →  VMID = 1.65 V</text>
<text x="32" y="328" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">R3 = 1 kΩ en serie: VCT → VS</text>
<text x="32" y="347" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">D1 BAT54S: VS limitado a GND…3V3</text>
<text x="32" y="366" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">C2 = 1 nF VS→GND (filtro ~160 kHz)</text>
<text x="32" y="385" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">VS = 1.65 V ± 1.41 V pico a 30 A</text>
<path d="M165 226 L165 244" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="340" y="76" width="300" height="226" rx="8" fill="#FDF3E3" stroke="#C98A1B" stroke-width="1.2"/>
<text x="352" y="98" font-size="14" font-weight="bold" fill="#633806" text-anchor="start">3 · Comparador de ventana (rápido)</text>
<text x="352" y="120" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">U1 TLV1702: doble, riel a riel, drenaje abierto</text>
<text x="352" y="139" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">R4 4.7 kΩ · R5 24 kΩ · R6 4.7 kΩ (3V3→GND)</text>
<text x="373" y="158" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">VH = 2.84 V     VL = 0.46 V</text>
<text x="352" y="177" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">U1A: IN+ = VH, IN− = VS  (pico positivo)</text>
<text x="352" y="196" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">U1B: IN+ = VS, IN− = VL  (pico negativo)</text>
<text x="352" y="215" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Salidas unidas + R7 10 kΩ a 3V3 → PEAK_N</text>
<text x="352" y="234" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Dispara si |VS−VMID| &gt; 1.19 V</text>
<text x="373" y="253" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">≈ 25 A RMS senoidal (35.6 A pico)</text>
<text x="352" y="272" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">R8 1 MΩ salida→IN+ (histéresis opcional)</text>
<rect x="340" y="322" width="300" height="120" rx="8" fill="#FDF3E3" stroke="#C98A1B" stroke-width="1.2"/>
<text x="352" y="344" font-size="14" font-weight="bold" fill="#633806" text-anchor="start">4 · Medición (camino lento)</text>
<text x="352" y="366" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">VS → ESP32 GPIO34 (ADC1_CH6)</text>
<text x="352" y="385" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">ESP32 calcula I RMS → registro 00</text>
<text x="352" y="404" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Precisión: ADS1115 por I2C o ATM90E32</text>
<text x="352" y="423" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">kWh requiere además medir voltaje</text>
<path d="M310 300 L326 300 L326 190 L338 190" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M326 300 L326 380 L338 380" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="316" y="294" font-size="12" font-weight="bold" fill="#633806" text-anchor="end">VS</text>
<rect x="690" y="76" width="270" height="366" rx="10" fill="#F0EEFC" stroke="#6A5FCF" stroke-width="1.6"/>
