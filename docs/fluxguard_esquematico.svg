<text x="700" y="310" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start">uio[4]</text>
<text x="700" y="325" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="start">PEAK_N</text>
