<text x="950" y="401" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="end">HEARTBEAT</text>
<line x1="960" y1="390" x2="974" y2="390" stroke="#6A5FCF" stroke-width="1.4"/>
<text x="950" y="424" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="end">uo[7]</text>
<text x="950" y="439" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="end">TRIP</text>
<line x1="960" y1="428" x2="974" y2="428" stroke="#6A5FCF" stroke-width="1.4"/>
